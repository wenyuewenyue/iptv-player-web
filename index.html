<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线电视直播</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #sidebar { width: 300px; background: #1e1e1e; display: flex; flex-direction: column; border-right: 1px solid #2a2a2a; }
    #header { padding: 16px; border-bottom: 1px solid #2a2a2a; }
    #header h2 { font-size: 1.1rem; margin-bottom: 10px; color: #4dabf7; }
    #search { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #333; background: #2b2b2b; color: #fff; outline: none; }
    #channel-list { flex: 1; overflow-y: auto; list-style: none; }
    .channel-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #262626; transition: background 0.2s; }
    .channel-item:hover { background: #2a2a2a; }
    .channel-item.active { background: #1971c2; color: #fff; font-weight: bold; }
    #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; position: relative; }
    video { width: 100%; height: 100%; max-height: 100vh; outline: none; }
    #custom-source { padding: 12px 16px; border-top: 1px solid #2a2a2a; display: flex; gap: 8px; }
    #source-input { flex: 1; padding: 6px 10px; border-radius: 4px; border: 1px solid #333; background: #2b2b2b; color: #fff; font-size: 0.85rem; }
    #source-btn { padding: 6px 12px; background: #228be6; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="header">
      <h2>电视直播</h2>
      <input type="text" id="search" placeholder="搜索电视频道...">
    </div>
    <ul id="channel-list"></ul>
    <div id="custom-source">
      <input type="text" id="source-input" placeholder="输入自定义 M3U 源地址">
      <button id="source-btn">导入</button>
    </div>
  </div>

  <div id="main">
    <video id="video" controls autoplay playsinline></video>
  </div>

  <script>
    const defaultChannels = [
      { name: "CCTV-1 综合", url: "https://live.fanmingming.com/tv/m3u/ipv6.m3u" },
      { name: "CCTV-13 新闻", url: "https://cctv13.live.cntv.myalicdn.com/cctv13_2/index.m3u8" },
      { name: "CCTV-4 中文国际", url: "https://cctv4.live.cntv.myalicdn.com/cctv4_2/index.m3u8" },
      { name: "湖南卫视", url: "https://live.fanmingming.com/tv/m3u/ipv6.m3u" },
      { name: "浙江卫视", url: "https://live.fanmingming.com/tv/m3u/ipv6.m3u" }
    ];

    let channels = [];
    const video = document.getElementById('video');
    const channelList = document.getElementById('channel-list');
    const searchInput = document.getElementById('search');
    let hls = null;

    function playChannel(url, itemEl) {
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      if (itemEl) itemEl.classList.add('active');

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(() => {});
      }
    }

    function renderChannels(list) {
      channelList.innerHTML = '';
      list.forEach(ch => {
        const li = document.createElement('li');
        li.className = 'channel-item';
        li.textContent = ch.name;
        li.onclick = () => playChannel(ch.url, li);
        channelList.appendChild(li);
      });
    }

    async function loadM3U(url) {
      try {
        const res = await fetch(url);
        const text = await res.text();
        const lines = text.split('\n');
        channels = [];
        let currentName = '';
        for (let line of lines) {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const parts = line.split(',');
            currentName = parts[parts.length - 1].trim();
          } else if (line && !line.startsWith('#')) {
            channels.push({ name: currentName || '未知频道', url: line });
            currentName = '';
          }
        }
        renderChannels(channels);
        if (channels.length > 0) playChannel(channels[0].url, channelList.firstChild);
      } catch (err) {
        alert('加载直播源失败，请确认链接是否支持跨域访问');
      }
    }

    document.getElementById('source-btn').onclick = () => {
      const url = document.getElementById('source-input').value.trim();
      if (url) loadM3U(url);
    };

    searchInput.oninput = (e) => {
      const q = e.target.value.toLowerCase();
      renderChannels(channels.filter(c => c.name.toLowerCase().includes(q)));
    };

    // 默认加载国内公共直播源
    loadM3U('https://live.fanmingming.com/tv/m3u/ipv6.m3u');
  </script>
</body>
</html>
